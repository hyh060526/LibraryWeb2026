<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 图书馆管理系统</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-wrap" id="app">
  <div class="card auth-card" style="max-width:560px">
    <div class="brand">
      <div class="brand-mark">图</div>
      <div>
        <h1>用户注册</h1>
        <p>同名账号、手机号不可重复</p>
      </div>
    </div>
    <div class="form-row"><label>姓名</label><input v-model="form.name"></div>
    <div class="form-row"><label>密码</label><input type="password" v-model="form.password"></div>
    <div class="form-row"><label>手机号</label><input v-model="form.phone" placeholder="11位手机号"></div>
    <div class="form-row">
      <label>专业</label>
      <select v-model="form.major">
        <option value="">请选择</option>
        <option>计算机科学与技术</option>
        <option>软件工程</option>
        <option>人工智能</option>
        <option>数据科学</option>
        <option>信息管理</option>
        <option>图书馆学</option>
        <option>车辆工程</option>
        <option>计算机科学</option>
      </select>
    </div>
    <div class="form-row">
      <label>角色</label>
      <select v-model="form.role">
        <option value="">请选择</option>
        <option>学生</option>
        <option>教师</option>
        <option>操作员</option>
        <option>管理员</option>
      </select>
    </div>

    <div v-if="form.role === '学生'">
      <div class="form-row"><label>年级</label><input v-model="form.grade" placeholder="如 2024级"></div>
      <div class="form-row"><label>所属学院</label><input v-model="form.college"></div>
    </div>
    <div v-if="form.role === '教师'">
      <div class="form-row"><label>所属学院</label><input v-model="form.college"></div>
      <div class="form-row"><label>职称</label><input v-model="form.title" placeholder="如 教授 / 讲师"></div>
    </div>
    <div v-if="form.role === '操作员'">
      <div class="form-row"><label>负责区域</label><input v-model="form.area"></div>
      <div class="form-row"><label>职务</label><input v-model="form.duty"></div>
    </div>
    <div v-if="form.role === '管理员'">
      <div class="form-row"><label>权限等级</label><input v-model="form.permissionLevel" placeholder="数字，默认 1"></div>
      <div class="form-row"><label>入职时间</label><input type="date" v-model="form.entryTime"></div>
    </div>

    <div class="btn-row">
      <button class="btn" @click="submit">注册</button>
      <a class="btn ghost" href="login.html">返回登录</a>
    </div>
    <div class="msg" :class="ok ? 'ok' : 'err'">{{ message }}</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="js/common.js"></script>
<script>
new Vue({
  el: '#app',
  data: {
    form: {
      name: '', password: '', phone: '', major: '', role: '',
      grade: '', college: '', title: '', area: '', duty: '',
      permissionLevel: '1', entryTime: ''
    },
    message: '',
    ok: false
  },
  methods: {
    submit: function () {
      var self = this;
      App.post('api/user/register', this.form).then(function () {
        self.ok = true;
        self.message = '注册成功，即将前往登录';
        setTimeout(function () { location.href = 'login.html'; }, 800);
      }).catch(function (e) {
        self.ok = false;
        self.message = e.message || '注册失败';
      });
    }
  }
});
</script>
</body>
</html>
