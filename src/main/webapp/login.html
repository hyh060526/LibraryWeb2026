<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 图书馆管理系统</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-wrap" id="app">
  <div class="card auth-card">
    <div class="brand">
      <div class="brand-mark">图</div>
      <div>
        <h1>图书馆管理系统</h1>
        <p>LibraryWeb2026</p>
      </div>
    </div>
    <h2>用户登录</h2>
    <p class="hint">请输入用户名、密码和验证码</p>
    <div class="form-row">
      <label>用户名</label>
      <input v-model="form.name" placeholder="例如 admin / student1 / teacher">
    </div>
    <div class="form-row">
      <label>密码</label>
      <input type="password" v-model="form.password" placeholder="请输入密码">
    </div>
    <div class="form-row">
      <label>验证码</label>
      <div class="inline">
        <input v-model="form.captcha" placeholder="不区分大小写" @keyup.enter="login">
        <img class="captcha" :src="captchaUrl" title="点击刷新" @click="refreshCaptcha">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" @click="login">提交登录</button>
      <button class="btn ghost" @click="reset">重置</button>
    </div>
    <div class="msg" :class="ok ? 'ok' : 'err'">{{ message }}</div>
    <p class="hint" style="margin-top:16px">没有账号？<a href="register.html">去注册</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="js/common.js"></script>
<script>
new Vue({
  el: '#app',
  data: {
    form: { name: '', password: '', captcha: '' },
    captchaUrl: 'api/captcha?t=' + Date.now(),
    message: '',
    ok: false
  },
  methods: {
    refreshCaptcha: function () {
      this.captchaUrl = 'api/captcha?t=' + Date.now();
    },
    reset: function () {
      this.form.name = '';
      this.form.password = '';
      this.form.captcha = '';
      this.message = '已重置用户名与密码';
      this.ok = true;
      this.refreshCaptcha();
    },
    login: function () {
      var self = this;
      self.message = '';
      App.post('api/user/login', this.form).then(function () {
        self.ok = true;
        self.message = '登录成功，正在进入首页…';
        location.href = 'index.html';
      }).catch(function (e) {
        self.ok = false;
        self.message = e.message || '登录失败';
        self.refreshCaptcha();
      });
    }
  }
});
</script>
</body>
</html>
